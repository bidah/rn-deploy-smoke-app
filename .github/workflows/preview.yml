name: preview

# Build the app on a GitHub macOS runner, publish to R2, then run baguette +
# a cloudflared quick tunnel ON the runner so you can view the app live.
# The runner is ephemeral: the URL lives only while this job is held open.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: minutes to keep the preview URL alive
        required: false
        default: "30"

jobs:
  preview:
    runs-on: macos-15        # Apple Silicon + macOS 15 (baguette needs arm64/15)
    timeout-minutes: 80
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: react-native-deploy
      R2_PUBLIC_BASE_URL: https://pub-58ef2003db8642af966d3c08e6bfdf91.r2.dev
      SCHEME: smokeapp
      BUNDLE_ID: com.bidah.rndeploysmoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pin ONE Xcode 26 + DISABLE all others
        run: |
          echo "Installed Xcodes:"; ls -d /Applications/Xcode*.app 2>/dev/null || true
          # Build needs Xcode 26 (Swift 6.2). EVERYTHING — build, simctl, the
          # booted runtime, Simulator.app, baguette — must use this SAME Xcode.
          # The runner ships several Xcodes; baguette dlopen's SimulatorKit and
          # ends up loading TWO copies (e.g. 16.4 + 26.3) => duplicate-class
          # collisions => 0-fps stream. Fix: physically rename every OTHER Xcode
          # aside so only ONE SimulatorKit exists on the whole machine.
          XC_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XC_APP" ] && XC_APP=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          # resolve through any version symlink to the real bundle
          XC_REAL=$(python3 -c "import os,sys;print(os.path.realpath(sys.argv[1]))" "$XC_APP")
          echo "Chosen Xcode: $XC_APP  (real: $XC_REAL)"
          sudo xcode-select -s "$XC_REAL/Contents/Developer"
          echo "DEVELOPER_DIR=$XC_REAL/Contents/Developer" >> "$GITHUB_ENV"
          echo "XC_APP=$XC_REAL" >> "$GITHUB_ENV"
          # Kill any sim service still bound to the old Xcode
          sudo pkill -9 -f CoreSimulatorService 2>/dev/null || true
          sleep 2
          # Disable every Xcode bundle that is NOT our chosen one (rename = instant).
          # Skip the generic /Applications/Xcode.app symlink — we re-point it below.
          for app in /Applications/Xcode_*.app; do
            REAL=$(python3 -c "import os,sys;print(os.path.realpath(sys.argv[1]))" "$app")
            if [ "$REAL" != "$XC_REAL" ]; then
              echo "disabling $app -> ${app}.disabled (real: $REAL)"
              sudo mv "$app" "${app}.disabled" 2>/dev/null || true
            fi
          done
          # baguette's binary has a HARDCODED rpath to
          #   /Applications/Xcode.app/Contents/Developer/Library/PrivateFrameworks/SimulatorKit.framework
          # so the generic Xcode.app MUST exist and point at our chosen Xcode —
          # otherwise baguette either loads a DIFFERENT Xcode's SimulatorKit
          # (dual-load => 0 fps) or fails to load it at all (dyld crash).
          sudo rm -rf /Applications/Xcode.app
          sudo ln -s "$XC_REAL" /Applications/Xcode.app
          echo "Xcode.app -> $(python3 -c "import os;print(os.path.realpath('/Applications/Xcode.app'))")"
          echo "Remaining Xcodes:"; ls -ld /Applications/Xcode*.app 2>/dev/null || true
          xcodebuild -version
          swift --version || true

      - name: Ensure AWS CLI (for R2 uploads)
        run: which aws || brew install awscli

      - name: Install rn-deploy (from the public R2 tooling tarball)
        run: |
          curl -fL --retry 3 "$R2_PUBLIC_BASE_URL/tooling/rn-deploy.tgz" -o /tmp/rn-deploy.tgz
          npm install -g /tmp/rn-deploy.tgz
          rn-deploy --version

      - name: Write deploy.config.json (no secrets — keys come from env)
        run: |
          cat > deploy.config.json <<JSON
          {
            "cli": { "version": "1.0.0" },
            "host": { "kind": "github-actions", "repo": "bidah/rn-deploy-smoke-app", "workflow": "preview.yml", "ref": "main" },
            "storage": { "kind": "r2", "accountId": "${R2_ACCOUNT_ID}", "bucket": "${R2_BUCKET}", "publicBaseUrl": "${R2_PUBLIC_BASE_URL}" },
            "repo": { "url": "https://github.com/bidah/rn-deploy-smoke-app.git", "branch": "main" },
            "build": { "preview": { "buildType": "expo", "scheme": "${SCHEME}", "buildConfiguration": "Release", "distribution": "simulator", "env": {} } },
            "app": { "slug": "smokeapp" }
          }
          JSON
          echo "wrote deploy.config.json"

      - name: Build + publish to R2
        run: rn-deploy run-build --profile preview

      - name: Boot simulator + install the build (GUI rendering context)
        run: |
          # Default device set + Simulator.app GUI: baguette's framebuffer capture
          # needs a real rendering context, which a headless `simctl boot` doesn't
          # provide (that's why the stream was 0 fps). Launching Simulator.app
          # gives the booted device a live display for baguette to capture.
          xcrun simctl shutdown all || true
          # Pick an iPhone on the LATEST iOS runtime (reverse sort) so it matches
          # baguette's "Latest Runtime" filter AND the pinned Xcode's runtime.
          UDID=$(xcrun simctl list devices available --json | python3 -c "import sys,json;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for rt in sorted(d, reverse=True) for x in d[rt] if 'iPhone' in x['name'] and x['isAvailable']))")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          # bring up the Simulator GUI by EXACT binary path (not `open -a`, which
          # lets LaunchServices pick a different registered Simulator.app) so the
          # render context comes from the same Xcode as everything else.
          SIM_BIN="$XC_APP/Contents/Developer/Applications/Simulator.app/Contents/MacOS/Simulator"
          echo "Launching: $SIM_BIN"
          nohup "$SIM_BIN" -CurrentDeviceUDID "$UDID" >/tmp/sim.log 2>&1 &
          sleep 8
          tar -xzf "build/${SCHEME}.app.tgz"
          xcrun simctl install "$UDID" "${SCHEME}.app"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "${SCHEME}.app/Info.plist")
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "Installed app container: $(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID")"
          xcrun simctl launch "$UDID" "$BUNDLE_ID"

      - name: Install baguette + cloudflared (standalone binaries)
        run: |
          VER=v0.1.3
          mkdir -p "$HOME/.baguette/$VER"
          curl -fL --retry 3 -o /tmp/b.tgz "https://github.com/tddworks/baguette/releases/download/$VER/baguette_${VER}_macOS_arm64.tar.gz"
          tar -xzf /tmp/b.tgz -C "$HOME/.baguette/$VER"
          chmod +x "$HOME/.baguette/$VER/baguette-$VER-macOS-arm64/Baguette"
          mkdir -p "$HOME/.local/bin"
          curl -fL --retry 3 -o /tmp/cf.tgz https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz
          tar -xzf /tmp/cf.tgz -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/cloudflared"

      - name: Diagnose baguette CLI + simulator state
        run: |
          VER=v0.1.3
          B="$HOME/.baguette/$VER/baguette-$VER-macOS-arm64/Baguette"
          s3() { AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_REGION=auto aws s3 cp "$1" "s3://$R2_BUCKET/preview/$2" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --content-type "$3" || true; }
          {
            echo "== UDID =="; echo "$UDID"
            echo "== DEVELOPER_DIR =="; echo "$DEVELOPER_DIR"
            echo "== booted devices =="; xcrun simctl list devices booted
            echo "== Simulator.app running? =="; pgrep -fl Simulator.app || echo "not running"
            echo "== app container =="; xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" 2>&1 || true
          } > /tmp/diag.txt 2>&1
          cat /tmp/diag.txt
          s3 /tmp/diag.txt smokeapp-diag.txt text/plain

      - name: Start baguette + tunnel, publish URL to R2
        run: |
          VER=v0.1.3
          B="$HOME/.baguette/$VER/baguette-$VER-macOS-arm64/Baguette"
          s3() { AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_REGION=auto aws s3 cp "$1" "s3://$R2_BUCKET/preview/$2" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --content-type "$3" || true; }
          # Relaunch to foreground, then serve the default set (Simulator.app GUI
          # is providing the render context).
          xcrun simctl launch "$UDID" "$BUNDLE_ID" || true
          nohup "$B" serve --host 127.0.0.1 --port 8421 >/tmp/baguette.log 2>&1 &
          sleep 3
          nohup "$HOME/.local/bin/cloudflared" tunnel --url http://localhost:8421 >/tmp/cf.log 2>&1 &
          URL=""
          for i in $(seq 1 40); do
            URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          # capture a screenshot of the streamed device + baguette log for inspection
          sleep 5
          xcrun simctl io "$UDID" screenshot /tmp/shot.png 2>/tmp/shot.err || true
          s3 /tmp/shot.png smokeapp-shot.png image/png
          s3 /tmp/baguette.log smokeapp-baguette.log text/plain
          if [ -z "$URL" ]; then echo "no tunnel URL"; tail -25 /tmp/cf.log; exit 1; fi
          PREVIEW="$URL/simulators"
          echo "PREVIEW URL: $PREVIEW"
          printf '%s' "$PREVIEW" > /tmp/url.txt
          s3 /tmp/url.txt smokeapp-url.txt text/plain
          { echo "## 🔗 Preview URL"; echo "[$PREVIEW]($PREVIEW)"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Hold the runner open
        run: |
          MIN="${{ github.event.inputs.minutes }}"
          echo "Holding open for ${MIN:-30} minutes..."
          sleep $(( ${MIN:-30} * 60 ))
